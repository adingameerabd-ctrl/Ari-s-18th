<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Birthday Registry ♡</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- HEADER -->

    <header class="header">

        <div class="heart">
            ♡
        </div>

        <div>

            <div class="eyebrow">
                BIRTHDAY REGISTRY
            </div>

            <h1>
                Things Ari would love (off the top of her head at the moment) ♡
            </h1>

            <p class="subtitle">
                A little collection of things on my wishlist.
            </p>

        </div>

    </header>


    <!-- MAIN CONTENT -->

    <main>

        <!-- CATEGORIES -->

        <div
            class="categories"
            id="categories"
        >

            <button
                class="category active"
                data-category="all"
            >
                All
            </button>

            <button
                class="category"
                data-category="electronics"
            >
                🎮 Electronics
            </button>

            <button
                class="category"
                data-category="miscellaneous"
            >
                ✨ Miscellaneous
            </button>

            <button
                class="category"
                data-category="books"
            >
                📚 Book Collections
            </button>

        </div>


        <!-- GIFT CARDS WILL APPEAR HERE -->

        <div
            class="gift-grid"
            id="giftGrid"
        ></div>

    </main>


    <!-- GIFT MODAL -->

    <div
        class="modal hidden"
        id="giftModal"
    >

        <div class="modal-content">

            <button
                class="close-button"
                id="closeModal"
                aria-label="Close"
            >
                ×
            </button>


            <div
                class="modal-image-wrapper"
                id="modalImageWrapper"
            >

                <img
                    id="modalImage"
                    src=""
                    alt=""
                >

            </div>


            <div
                class="modal-category"
                id="modalCategory"
            ></div>


            <h2
                id="modalName"
            ></h2>


            <p
                class="modal-description"
                id="modalDescription"
            ></p>


            <div
                class="modal-price"
                id="modalPrice"
            ></div>


            <div
                class="modal-status"
                id="modalStatus"
            >
                ♡ Available
            </div>


            <button
                class="primary-button"
                id="selectButton"
            >
                Select this gift ♡
            </button>

        </div>

    </div>

<script src="script.js"></script>

</body>

</html>
