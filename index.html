<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ari's 18th Birthday Registry ♡</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

    <header class="header">

        <div class="heart">♡</div>

        <div>
            <p class="small-title">BIRTHDAY BASH</p>

            <h1>Things I'd Love ♡</h1>

            <p class="subtitle">
                A simple custom gift registry, designed by yours truly! 🎁💗

Just a little something to make gift planning easier and help everyone find something I’d love! 🫶 No pressure, of course! :)) 
            </p>
        </div>

    </header>


    <main>

        <!-- CATEGORY BUTTONS -->

        <div class="categories">

     <div class="categories">

    <button
        class="category active"
        onclick="filterGifts('all')"
    >
        All
    </button>

    <button
        class="category"
        onclick="filterGifts('electronics')"
    >
        🎮 Electronics
    </button>

    <button
        class="category"
        onclick="filterGifts('miscellaneous')"
    >
        ✨ Miscellaneous
    </button>

    <button
        class="category"
        onclick="filterGifts('book collections')"
    >
        📚 Book Collections
    </button>

</div>

        <!-- GIFT GRID -->

        <div
            id="giftGrid"
            class="gift-grid"
        ></div>

    </main>


    <!-- GIFT POPUP -->

    <div
        id="giftModal"
        class="modal hidden"
    >

        <div class="modal-content">

            <button
                class="close"
                onclick="closeModal()"
            >
                ×
            </button>


            <img
                id="modalImage"
                src=""
                alt=""
            >


            <div class="modal-category"
                id="modalCategory">
            </div>


            <h2 id="modalName"></h2>


            <p
                id="modalDescription"
                class="modal-description"
            ></p>


            <div
                id="modalPrice"
                class="modal-price"
            ></div>


            <div
                id="modalStatus"
                class="modal-status"
            >
            </div>


            <button
                id="selectButton"
                class="primary-button"
            >
                Select this gift ♡
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
